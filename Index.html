<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#f5f7fb;--surface:#fff;--text:#172033;--muted:#667085;--line:#e4e7ec;--brand:#1d4ed8;--sidebar:#101828}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}
.shell{display:flex;min-height:100vh}.sidebar{width:250px;background:var(--sidebar);color:#fff;padding:18px;position:sticky;top:0;height:100vh;overflow:auto}.brand{font-size:20px;font-weight:800}.nav{display:grid;gap:4px;margin-top:18px}.nav button{border:0;background:transparent;color:#d0d5dd;text-align:left;padding:10px 11px;border-radius:8px;cursor:pointer}.nav button.active,.nav button:hover{background:#1d2939;color:#fff}.main{flex:1;min-width:0}.header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:5}.content{padding:22px}.page-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:16px}.page-head h1{margin:0 0 5px}.muted{color:var(--muted)}.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.toolbar input,.field input,.field select,.field textarea{border:1px solid #d0d5dd;border-radius:8px;padding:10px;background:#fff;min-height:40px}.toolbar input{min-width:240px}.btn{border:1px solid #d0d5dd;border-radius:8px;padding:10px 14px;background:#fff;cursor:pointer}.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.table-wrap{overflow:auto;border:1px solid var(--line);border-radius:10px}.data-table{width:100%;border-collapse:collapse;min-width:760px}.data-table th,.data-table td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}.data-table th{background:#f9fafb;font-size:12px;color:var(--muted);text-transform:uppercase}.empty{text-align:center;padding:28px;color:var(--muted)}.pagination{display:flex;justify-content:space-between;margin-top:12px}.badge{display:inline-flex;padding:4px 8px;border-radius:999px;background:#f2f4f7;font-size:12px}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;padding:18px;z-index:20}.modal.open{display:flex}.modal-box{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:14px;padding:18px}.modal-head{display:flex;justify-content:space-between}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.kpi-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.kpi .value{font-size:25px;font-weight:800;margin-top:6px}
@media(max-width:900px){.kpi-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:700px){.sidebar{display:none}.content{padding:14px}.form-grid{grid-template-columns:1fr}.page-head{flex-direction:column}.toolbar input{min-width:0;flex:1}}@media(max-width:430px){.kpi-grid{grid-template-columns:1fr}}
</style></head>
<body><div id="app"></div>
<script>
var MODULES=<?!= JSON.stringify(MC_MODULES) ?>;
var NAV=[['Dashboard','Dashboard'],['Transaksi','Transaksi'],['RiwayatTransaksi','Riwayat'],['Booking','Booking'],['Nasabah','Nasabah'],['DTOTT','DTOTT'],['Bank','Bank'],['Pengeluaran','Pengeluaran'],['Gantungan','Gantungan'],['SaldoAwal','Saldo Awal'],['Closing','Closing'],['Gallery','Gallery'],['ManajemenKurs','Manajemen Kurs'],['MasterMataUang','Mata Uang'],['DenominasiValas','Denominasi'],['Koin','Koin'],['UangLama','Uang Lama'],['Pelaporan','Pelaporan'],['Kalkulator','Kalkulator'],['Translate','Translate'],['PublicKurs','Public Kurs'],['Settings','Settings'],['UserProfile','Profil'],['UsersRoles','Users & Roles'],['WAGateway','WA Gateway'],['WATemplate','WA Template']];
var APP={token:localStorage.getItem('mc_token')||'',module:'Dashboard',page:1,pageSize:25,search:''};
function $(id){return document.getElementById(id)}
function esc(v){return String(v==null?'':v).split('&').join('&amp;').split('<').join('&lt;').split('>').join('&gt;').split('"').join('&quot;')}
function api(a,p){p=p||{};p.token=APP.token;return new Promise(function(ok,bad){google.script.run.withSuccessHandler(ok).withFailureHandler(bad).api_(a,p)})}
function login(){document.body.innerHTML='<div class="card" style="max-width:390px;margin:12vh auto"><h1>MC-Almara</h1><p class="muted">Login ERP</p><div class="field"><label>Username</label><input id="username"></div><div class="field"><label>Password</label><input id="password" type="password"></div><button class="btn primary" onclick="doLogin()">Masuk</button></div>'}
async function doLogin(){try{var r=await api('login',{username:$('username').value,password:$('password').value});APP.token=r.token;localStorage.setItem('mc_token',APP.token);location.reload()}catch(e){alert(e.message||e)}}
function shell(){document.body.innerHTML='<div class="shell"><aside class="sidebar"><div class="brand">MC-Almara</div><div class="muted" style="color:#98a2b3">ERP Money Changer</div><div class="nav">'+NAV.map(function(n){return '<button data-module="'+n[0]+'" onclick="openPage(\''+n[0]+'\')">'+n[1]+'</button>'}).join('')+'</div></aside><main class="main"><header class="header"><b id="title">Dashboard</b><span class="muted">Online</span></header><section class="content" id="content"></section></main></div><div id="modal" class="modal"><div class="modal-box" id="modalBox"></div></div>'}
async function boot(){try{await api('dashboard');shell();openPage('Dashboard')}catch(e){localStorage.removeItem('mc_token');APP.token='';login()}}
async function openPage(module){APP.module=module;APP.page=1;APP.search='';document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('active',b.dataset.module===module)});$('title').textContent=MODULES[module].title;if(module==='Dashboard'){dashboard(await api('dashboard'));return}renderPage(await api('moduleSchema',{module}))}
function renderPage(s){var h='<div class="page-head"><div><h1>'+esc(s.title)+'</h1><div class="muted">Filter → tabel → formulir/detail → action</div></div>'+(s.form.length?'<button class="btn primary" onclick="formOpen()">+ Tambah</button>':'')+'</div><div class="toolbar"><input id="search" placeholder="Cari..." onkeydown="if(event.key===\'Enter\'){APP.search=this.value;APP.page=1;rows()}"><button class="btn" onclick="APP.search=$(\'search\').value;APP.page=1;rows()">Cari</button><button class="btn" onclick="APP.search=\'\';APP.page=1;rows()">Reset</button></div><div class="card"><div id="table">Memuat...</div></div>';$('content').innerHTML=h;rows()}
async function rows(){var r=await api('moduleList',{module:APP.module,query:{search:APP.search,page:APP.page,pageSize:APP.pageSize}});var s=MODULES[APP.module],h='<div class="table-wrap"><table class="data-table"><thead><tr>'+s.columns.map(function(c){return '<th>'+esc(c[1])+'</th>'}).join('')+(s.form.length?'<th>Aksi</th>':'')+'</tr></thead><tbody>';if(!r.rows.length)h+='<tr><td colspan="'+(s.columns.length+(s.form.length?1:0))+'" class="empty">Belum ada data</td></tr>';r.rows.forEach(function(x){h+='<tr>'+s.columns.map(function(c){return '<td>'+cell(x[c[0]],c[2])+'</td>'}).join('')+(s.form.length?'<td><button class="btn" onclick="editRow(\''+esc(x.ID)+'\')">Edit</button></td>':'')+'</tr>'});h+='</tbody></table></div><div class="pagination"><span class="muted">Total '+r.total+' • Halaman '+r.page+'</span><div><button class="btn" onclick="APP.page=Math.max(1,APP.page-1);rows()">‹</button> <button class="btn" onclick="APP.page++;rows()">›</button></div></div>';$('table').innerHTML=h}
function cell(v,t){if(v==null||v==='')return '<span class="muted">—</span>';if(t==='number')return Number(v).toLocaleString('id-ID');if(t==='status')return '<span class="badge">'+esc(v)+'</span>';return esc(v)}
function formOpen(existing){var s=MODULES[APP.module],h='<div class="modal-head"><h2>'+esc(existing?'Edit ':'Tambah ')+esc(s.title)+'</h2><button class="btn" onclick="formClose()">×</button></div><form class="form-grid" id="form">';s.form.forEach(function(f){var k=f[0],l=f[1],t=f[2],v=existing?(existing[k]||''):'';var inp=t==='textarea'?'<textarea id="f_'+k+'" rows="4">'+esc(v)+'</textarea>':'<input id="f_'+k+'" type="'+(t==='number'?'number':t==='email'?'email':t==='url'?'url':t==='date'?'date':'text')+'" value="'+esc(v)+'">';h+='<div class="field '+(t==='textarea'?'full':'')+'"><label>'+esc(l)+(f[3]?' *':'')+'</label>'+inp+'</div>'});h+='</form><div class="modal-actions"><button class="btn" onclick="formClose()">Batal</button><button class="btn primary" onclick="saveForm('+(existing?JSON.stringify(existing.ID):'null')+')">Simpan</button></div>';$('modalBox').innerHTML=h;$('modal').classList.add('open')}
async function editRow(id){var r=await api('moduleGet',{module:APP.module,id:id});if(r)formOpen(r)}
function formClose(){$('modal').classList.remove('open')}
async function saveForm(id){var s=MODULES[APP.module],record={};s.form.forEach(function(f){record[f[0]]=$('f_'+f[0]).value});try{if(id)await api('moduleUpdate',{module:APP.module,id:id,record:record});else await api('moduleCreate',{module:APP.module,record:record});formClose();rows()}catch(e){alert(e.message||e)}}
function dashboard(d){$('content').innerHTML='<div class="page-head"><div><h1>Dashboard</h1><div class="muted">Struktur siap; angka finansial tetap berasal dari Core Engine.</div></div></div><div class="kpi-grid">'+[['Pembelian',d.purchase],['Penjualan',d.sale],['Kas',d.cash],['Bank',d.bank]].map(function(x){return '<div class="card kpi"><div class="muted">'+x[0]+'</div><div class="value">Rp '+Number(x[1]||0).toLocaleString('id-ID')+'</div></div>'}).join('')+'</div>'}
boot();
</script></body></html>
