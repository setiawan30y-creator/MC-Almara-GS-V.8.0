<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;margin:0;background:#f5f7fb;color:#172033}.shell{display:flex;min-height:100vh}.side{width:230px;background:#101828;color:white;padding:20px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:#d0d5dd;padding:11px;border-radius:9px}.side button:hover{background:#ffffff15;color:white}.main{flex:1}.top{height:64px;background:#fff;border-bottom:1px solid #e6eaf0;display:flex;align-items:center;justify-content:space-between;padding:0 22px}.content{padding:22px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:white;border:1px solid #e6eaf0;border-radius:14px;padding:16px}.field{display:flex;flex-direction:column;gap:5px;margin:8px 0}.field input,.field select{padding:10px;border:1px solid #e6eaf0;border-radius:9px}.btn{padding:10px 14px;border:0;border-radius:9px;background:#1d4ed8;color:white}@media(max-width:700px){.side{display:none}.grid{grid-template-columns:1fr 1fr}.content{padding:14px}}@media(max-width:430px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script>const S={t:localStorage.getItem('mc_token')||'',u:null};function api(a,p={}){p.token=S.t;return new Promise((r,j)=>google.script.run.withSuccessHandler(r).withFailureHandler(j).api_(a,p))}function draw(){document.getElementById('app').innerHTML='<div class="shell"><aside class="side"><h2>MC-Almara</h2><button onclick="dash()">Dashboard</button><button onclick="tx()">Transaksi</button><button onclick="cust()">Nasabah</button><button onclick="hist()">Riwayat</button><button onclick="pub()">Public Kurs</button></aside><main class="main"><header class="top"><b>Google Sheets ERP</b><span>'+((S.u&&S.u.name)||'Guest')+'</span></header><section class="content" id="c"></section></main></div>';S.t?dash():login()}function login(){c.innerHTML='<div class="card" style="max-width:380px;margin:10vh auto"><h1>MC-Almara</h1><div class="field"><label>Username</label><input id="un"></div><div class="field"><label>Password</label><input id="pw" type="password"></div><button class="btn" onclick="goLogin()">Masuk</button></div>'}async function goLogin(){try{const r=await api('login',{username:un.value,password:pw.value});S.t=r.token;S.u=r.user;localStorage.setItem('mc_token',S.t);draw()}catch(e){alert(e.message)}}async function dash(){const d=await api('dashboard');c.innerHTML='<h1>Dashboard</h1><div class="grid">'+[['Pembelian',d.purchase],['Penjualan',d.sale],['Kas',d.cash],['Bank',d.bank]].map(x=>'<div class="card"><small>'+x[0]+'</small><h2>Rp '+Number(x[1]).toLocaleString('id-ID')+'</h2></div>').join('')+'</div>'}async function cust(){const a=await api('customers');c.innerHTML='<h1>Nasabah</h1><div class="card"><button class="btn" onclick="addCust()">+ Nasabah</button><table style="width:100%;margin-top:15px"><tr><th>Kode</th><th>Nama</th><th>ID</th><th>Telepon</th></tr>'+a.map(x=>'<tr><td>'+x.CODE+'</td><td>'+x.NAME+'</td><td>'+x.ID_NUMBER+'</td><td>'+x.PHONE+'</td></tr>').join('')+'</table></div>'}function addCust(){c.innerHTML='<h1>Nasabah Baru</h1><div class="card"><div class="field"><label>Nama</label><input id="nm"></div><div class="field"><label>Jenis ID</label><input id="it"></div><div class="field"><label>No ID</label><input id="ii"></div><div class="field"><label>Telepon</label><input id="ph"></div><button class="btn" onclick="saveC()">Simpan</button></div>'}async function saveC(){await api('saveCustomer',{name:nm.value,idType:it.value,idNumber:ii.value,phone:ph.value});cust()}async function tx(){const cs=await api('currencies');c.innerHTML='<h1>Transaksi</h1><div class="card"><div class="field"><label>ID Nasabah</label><input id="ci"></div><div class="field"><label>Side</label><select id="si"><option>BUY</option><option>SELL</option></select></div><div class="field"><label>Currency</label><select id="cu">'+cs.map(x=>'<option>'+x.ISO_CODE+'</option>').join('')+'</select></div><div class="field"><label>Amount</label><input id="am" type="number"></div><div class="field"><label>Rate</label><input id="ra" type="number"></div><button class="btn" onclick="post()">Posting</button></div>'}async function post(){const total=Number(am.value)*Number(ra.value);try{const r=await api('createTransaction',{customerId:ci.value,side:si.value,currency:cu.value,foreignAmount:Number(am.value),rate:Number(ra.value),payments:[{method:'CASH',amount:total}]});alert('Berhasil '+r.invoice);hist()}catch(e){alert(e.message)}}async function hist(){const a=await api('transactions');c.innerHTML='<h1>Riwayat</h1><div class="card"><table style="width:100%"><tr><th>Invoice</th><th>Side</th><th>Currency</th><th>Total</th></tr>'+a.map(x=>'<tr><td>'+x.INVOICE_NO+'</td><td>'+x.SIDE+'</td><td>'+x.CURRENCY+'</td><td>Rp '+Number(x.IDR_TOTAL).toLocaleString('id-ID')+'</td></tr>').join('')+'</table></div>'}async function pub(){const a=await api('publicRates');c.innerHTML='<h1>Public Kurs Display</h1><div class="grid">'+a.map(x=>'<div class="card"><h2>'+x.CURRENCY+'</h2><div>Buy: '+x.BUY_RATE+'</div><div>Sell: '+x.SELL_RATE+'</div></div>').join('')+'</div>'}draw();</script></body></html>
