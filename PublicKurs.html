<!doctype html><html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f7f9;color:#123} .wrap{max-width:1100px;margin:auto;padding:28px}.brand{display:flex;align-items:center;gap:16px;margin-bottom:24px}.brand img{width:56px;height:56px;object-fit:contain}.brand h1{margin:0}.muted{color:#6b7280}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#fff;border-radius:16px;padding:18px;box-shadow:0 4px 18px rgba(0,0,0,.06)}.rate{font-size:24px;font-weight:700}.row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-bottom:1px solid #eee}.row:last-child{border-bottom:0}.status{font-size:12px;color:#15803d}.video{width:100%;aspect-ratio:16/9;border:0;border-radius:12px}@media(max-width:600px){.wrap{padding:16px}}
</style></head><body><main class="wrap"><div id="app">Memuat kurs...</div></main><script>
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,function(s){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[s]})}
function render(x){var c=x.company||{},rates=x.rates||[],p=x.playlist||[];var h='<div class="brand">'+(c.LOGO?'<img src="'+esc(c.LOGO)+'">':'')+'<div><h1>'+esc(c.BRAND||c.NAME||'MC-Almara')+'</h1><div class="muted">'+esc(c.ADDRESS||'')+'</div></div></div><div class="card"><div class="status">● Kurs aktif</div><div class="grid" style="margin-top:12px">';rates.forEach(function(r){h+='<div class="card"><b>'+esc(r.CURRENCY)+'</b><div class="row"><span>Buy</span><strong>'+Number(r.BUY_RATE||0).toLocaleString('id-ID')+'</strong></div><div class="row"><span>Sell</span><strong>'+Number(r.SELL_RATE||0).toLocaleString('id-ID')+'</strong></div><div class="muted" style="font-size:12px;margin-top:8px">Update: '+esc(r.TIMESTAMP||'-')+'</div></div>'});h+='</div></div>';if(p.length){h+='<div class="card" style="margin-top:16px"><h2>Video</h2>';p.forEach(function(v){var id=v.VIDEO_ID;if(!id){var m=String(v.URL||'').match(/[?&]v=([^&]+)/)||String(v.URL||'').match(/youtu\.be\/([^?]+)/);id=m?m[1]:''}if(id)h+='<iframe class="video" src="https://www.youtube.com/embed/'+esc(id)+'" allowfullscreen></iframe>'});h+='</div>'}h+='<div class="card" style="margin-top:16px"><b>'+esc(c.NAME||'MC-Almara')+'</b><div class="muted">'+esc(c.PHONE||'')+' • '+esc(c.WHATSAPP||'')+' • '+esc(c.OPERATING_HOURS||'')+'</div></div>';document.getElementById('app').innerHTML=h}
google.script.run.withSuccessHandler(function(r){if(!r||!r.ok){document.getElementById('app').innerHTML='<div class="card">Gagal memuat kurs</div>';return}render(r.data)}).withFailureHandler(function(e){document.getElementById('app').innerHTML='<div class="card">Gagal memuat kurs: '+esc(e&&e.message||e)+'</div>'}).mcApi('publicRates',{});
</script></body></html>
